# .github/workflows/weekly-healthcheck.yml
name: Weekly pipeline health check

on:
  schedule:
    - cron: '0 6 * * 1'   # Monday, loosely timed — this is a summary, not a race
  workflow_dispatch: {}

permissions:
  actions: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Count successful daily-brief runs in the last 7 days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SINCE=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          COUNT=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-brief.yml/runs?status=success&per_page=20" \
            --jq "[.workflow_runs[] | select(.created_at > \"$SINCE\")] | length")
          echo "Successful runs in the last 7 days: $COUNT"
          if [ "$COUNT" -lt 5 ]; then
            echo "::error::Only $COUNT of 5 expected weekday runs succeeded in the last 7 days — the daily pipeline may be silently stalled."
            exit 1
          fi
